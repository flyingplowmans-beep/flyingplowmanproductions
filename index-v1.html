<script>
(function(){
  const hero = document.getElementById("hero");
  const bg = hero && hero.querySelector(".hero-bg");
  if(!hero || !bg) return;

  const strength = 1.35; // increase to 0.25 for stronger parallax
  let ticking = false;

  function update(){
    ticking = false;
    const rect = hero.getBoundingClientRect();
    const vh = window.innerHeight;

    // amount hero has moved through viewport (-vh .. +vh-ish)
    const scrollThrough = (vh - rect.top) / (vh + rect.height);
    const clamped = Math.max(0, Math.min(1, scrollThrough));

    // map to -1..+1 then scale in pixels
    const t = (clamped * 2) - 1;
    const offset = t * 380; // px travel range

    bg.style.transform = `translate3d(0, ${offset}px, 0) scale(1.08)`;
  }

  function onScroll(){
    if(!ticking){
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  update();
  window.addEventListener("scroll", onScroll, { passive:true });
  window.addEventListener("resize", update);
})();
</script>
